[package]
name = "viap"
version = "1.1.7"
description = "一个应用、数据迁移工具"
authors = ["Evan Lau"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "viap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Tauri dev 模式会以 --no-default-features 启动；custom-protocol 只放在默认 feature，
# 避免开发时 generate_context! 强制校验 frontendDist，导致热更新窗口无法加载 devUrl。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
portable = ["custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows 注册表读取，用于扫描已安装应用
winreg = "0.52"
# 系统信息获取，用于读取磁盘使用情况和进程锁检测
sysinfo = "0.31"
# 递归文件复制，用于迁移应用
fs_extra = "1.3"
# Tauri 对话框插件，用于目录选择
tauri-plugin-dialog = "2"
# Base64 编码，用于图标数据传输
base64 = "0.22"
# 图像处理，用于图标格式转换
image = "0.25"
# 延迟初始化静态变量，用于图标缓存
lazy_static = "1.5"
# 获取系统特殊文件夹路径（桌面、文档、下载等）
dirs = "5.0"
# 目录递归遍历，用于强力卸载残留扫描
walkdir = "2.5"
# 回收站支持（跨平台），避免误删无法恢复
trash = "5"
# 并行迭代器，用于注册表扫描、文件系统扫描并行化
rayon = "1.10"
# SHA1 哈希，用于图标磁盘缓存 key 计算
sha1 = "0.10"
# Windows NTFS Junction 创建（无需管理员权限，同盘优先）
junction = "1.0"
# Minisign 签名解析与流式校验，用于验证发行版 exe 完整性
minisign-verify = "0.2.5"
# 仅启用 rustls，避免完整性校验引入系统 TLS 依赖
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }

# Windows API 绑定，用于提取应用图标
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_Shell",
] }
