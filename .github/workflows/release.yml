name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.1.7'
        required: false
        default: 'v1.1.7'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # - name: Rust cache
      #   uses: swatinem/rust-cache@v2
      #   with:
      #     workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          releaseBody: |
            ## v1.1.7 更新内容

            ### 数据兼容修复
            - 新增统一用户设置文件，主题、字号、默认迁移目录、回收站和扫描调试设置可随便携版目录携带
            - 便携版首次启动自动兼容已有安装版数据，复制缺失文件到本地 `data` 目录，不删除原安装版数据
            - 更改数据目录时改为递归迁移完整 Viap 数据和缓存，避免丢失应用模板、卸载日志、迁移元数据和应用快照

            ### 完整 Changelog
            详见 [CHANGELOG.md](https://github.com/Chunyu33/viap/blob/main/CHANGELOG.md)
          prerelease: false
          args: ${{ matrix.args }}

      # 完整性校验针对当前运行 exe，因此需要额外签名并上传原始 exe，而不只是安装包。
      - name: Sign standard integrity assets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chcp 65001
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          $tag = '${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}'
          $exe = "viap_${tag}_x64.exe"
          $builtExe = 'src-tauri/target/x86_64-pc-windows-msvc/release/viap.exe'
          $builtInstaller = Get-ChildItem -Path 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not (Test-Path $builtExe)) { throw '未找到标准版原始 exe' }
          if (-not $builtInstaller) { throw '未找到标准版安装包' }
          Copy-Item $builtExe $exe -Force
          foreach ($file in @($exe, $builtInstaller.FullName)) {
            npm run tauri -- signer sign $file
          }

      - name: Upload standard integrity assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          files: |
            viap_${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}_x64.exe
            viap_${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}_x64.exe.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig

  # 额外发行包不参与 updater latest.json，避免便携版或离线安装包被当成自动更新目标。
  release-extras:
    needs: release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build offline WebView2 installer
        shell: pwsh
        run: |
          chcp 65001
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.offline-webview2.conf.json --ci
          $installer = Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw '未找到 WebView2 离线安装包' }
          Copy-Item $installer.FullName "viap_${env:RELEASE_TAG}_x64-offline-webview2-setup.exe"
          $builtExe = 'src-tauri/target/x86_64-pc-windows-msvc/release/viap.exe'
          if (-not (Test-Path $builtExe)) { throw '未找到 WebView2 离线版原始 exe' }
          Copy-Item $builtExe "viap_${env:RELEASE_TAG}_x64-offline-webview2.exe"

      - name: Build portable package
        shell: pwsh
        run: |
          chcp 65001
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          npm run tauri -- build --target x86_64-pc-windows-msvc --no-bundle --features portable --ci
          $portableDir = Join-Path $pwd 'portable-package'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item 'src-tauri/target/x86_64-pc-windows-msvc/release/viap.exe' (Join-Path $portableDir 'viap.exe')
          Copy-Item 'src-tauri/target/x86_64-pc-windows-msvc/release/viap.exe' "viap_${env:RELEASE_TAG}_x64-portable.exe"
          @'
          Viap 便携版

          - 直接运行 viap.exe，无需安装。
          - 用户数据默认保存在本目录 data 文件夹。
          - 便携版不会自动检测或安装更新，请从 GitHub Releases 手动下载最新便携版。
          - Windows 10/11 通常已内置 WebView2；如果系统缺少 WebView2，请先安装微软官方运行环境。
          '@ | Set-Content -Encoding UTF8 (Join-Path $portableDir '便携版说明.txt')
          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath "viap_${env:RELEASE_TAG}_x64-portable.zip" -Force

      - name: Sign extra integrity assets
        shell: pwsh
        run: |
          chcp 65001
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          $files = @(
            "viap_${env:RELEASE_TAG}_x64-offline-webview2.exe",
            "viap_${env:RELEASE_TAG}_x64-offline-webview2-setup.exe",
            "viap_${env:RELEASE_TAG}_x64-portable.exe",
            "viap_${env:RELEASE_TAG}_x64-portable.zip"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "未找到待签名文件: $file" }
            npm run tauri -- signer sign $file
          }

      - name: Upload extra release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          files: |
            viap_${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}_x64-offline-webview2-setup.exe
            viap_${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}_x64-offline-webview2-setup.exe.sig
            viap_${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}_x64-offline-webview2.exe
            viap_${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}_x64-offline-webview2.exe.sig
            viap_${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}_x64-portable.exe
            viap_${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}_x64-portable.exe.sig
            viap_${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}_x64-portable.zip
            viap_${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}_x64-portable.zip.sig
