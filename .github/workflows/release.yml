name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc --bundles nsis,zip'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # - name: Rust cache
      #   uses: swatinem/rust-cache@v2
      #   with:
      #     workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseBody: |
            ## 更新内容
            ### 迁移引擎重构
            - 移除 rename 备份策略，改为复制完成后直接删除源目录，彻底解决 Shell 已知文件夹（桌面、视频、Chrome 缓存等）迁移时 PermissionDenied 失败的问题
            - 新流程 `copy → delete(source) → symlink` 消除了旧方案中双重失败的极端情况
            - 新增 `remove_directory_robust`：自动清除只读属性后删除，解决只读文件导致目录删除失败

            ### 迁移文件占用检测增强
            - 新增智能占用检测：含 exe 目录用进程路径匹配，数据目录用文件独占锁探测（FILE_SHARE_NONE）
            - 复制过程中被锁文件从静默跳过改为中断迁移，防止数据不完整
            - 源目录删除失败时不再忽略，避免残留导致 symlink 失败

            ### 恢复流程重构
            - 恢复前新增进程占用检测，在删除 Junction 之前拒绝恢复，避免 move_dir 失败后回滚破坏数据
            - move_dir 失败回滚时检查 target 完整性后才重建 Junction，防止指向残缺数据
            - 普通目录保护区分"上次恢复未完成"和"数据已恢复"两种情况，给出具体修复指引
            - 大文件夹恢复统一入口，确保 history 记录状态正确更新
            - 新增 `restore_large_folder_by_history` 含完整恢复逻辑和回滚保护

            ### UI 增强
            - 迁移历史链接状态区分"可修复（橙色）"和"严重损坏（红色）"两种异常
            - 进程锁检测阶段点击"取消迁移"即时响应，不再无反应
            - 进程锁检测阶段关闭弹窗不再弹出不必要的确认对话框
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
