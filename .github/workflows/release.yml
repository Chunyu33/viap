name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # - name: Rust cache
      #   uses: swatinem/rust-cache@v2
      #   with:
      #     workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseBody: |
            ## v1.0.7 更新内容

            ### 前端体验优化
            - 切换 Tab 不再重置搜索词、筛选条件和排序状态，操作更连贯
            - 页面切换增加底部滑入过渡动画
            - 危险应用默认隐藏：系统目录、浏览器、GPU 驱动等不可迁移项不再干扰列表，可一键切换查看
            - 设置页新增问题反馈入口（支持一键复制邮箱、GitHub Issues、QQ 群号）
            - 迁移记录页筛选栏固定吸附、列头点击排序

            ### 迁移安全增强
            - 创建目录链接失败时主动将数据移回原位置，避免数据滞留
            - 源目录删除失败提示更明确，区分进程占用、权限不足、只读保护
            - 危险路径名单扩充：Office、.NET Runtime 列入禁止迁移；新增 12 款软件/平台的风险提示

            ### 完整 Changelog
            详见 [CHANGELOG.md](https://github.com/ethan0925/viap/blob/main/CHANGELOG.md)
          prerelease: false
          args: ${{ matrix.args }}
