name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.1.2'
        required: false
        default: 'v1.1.2'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # - name: Rust cache
      #   uses: swatinem/rust-cache@v2
      #   with:
      #     workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          releaseBody: |
            ## v1.1.2 更新内容

            ### 启动体验优化
            - 前端首帧就绪后再显示主窗口，减少低配设备启动白屏
            - 首屏仅挂载应用管理页，其他页面首次访问时再加载

            ### 应用列表性能优化
            - 应用快照秒开，后台校验刷新
            - 图标改为自定义协议按需加载 PNG，减少 Base64 IPC 压力
            - 手动刷新会同步更新应用列表、图标、大小缓存和 debug 耗时

            ### 迁移与恢复增强
            - 迁移进度更连续，复制计划复用减少重复磁盘遍历
            - 恢复/还原按钮新增百分比进度反馈
            - 恢复流程加强校验和失败回滚

            ### 完整 Changelog
            详见 [CHANGELOG.md](https://github.com/Chunyu33/viap/blob/main/CHANGELOG.md)
          prerelease: false
          args: ${{ matrix.args }}
