name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # - name: Rust cache
      #   uses: swatinem/rust-cache@v2
      #   with:
      #     workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseBody: |
            ## v1.0.6 更新内容

            ### 图标磁盘持久化缓存
            - 图标提取结果缓存到磁盘（cache/icons/），跨重启命中，exe 升级后自动失效
            - 冷启动/休眠唤醒后图标加载大幅提速，避免重复 ExtractIconExW 调用

            ### 目录大小持久化缓存
            - 新增 size_cache.json，采用 SWR（Stale-While-Revalidate）策略
            - 启动时秒发缓存值，后台异步重算真实大小，有变化自动刷新
            - 机械硬盘、冷启动场景扫描耗时显著降低

            ### 应用列表排序
            - 新增列头点击排序：按名称（拼音）、按大小升序/降序
            - 纯本地内存排序，点击刷新后自动重置

            ### 完整 Changelog
            详见 [CHANGELOG.md](https://github.com/ethan0925/viap/blob/main/CHANGELOG.md)
          prerelease: false
          args: ${{ matrix.args }}
