name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # - name: Rust cache
      #   uses: swatinem/rust-cache@v2
      #   with:
      #     workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseBody: |
            ## v1.0.5 更新内容

            ### 应用列表加载性能优化
            - 大小计算从前端 IPC 调用改为 Rust 后台线程统一计算，通过 scan-progress 事件推送
            - 刷新列表时 rayon 并行 walkdir，返回结果直接携带准确大小
            - 前端不再做任何 IO 调度，仅被动接收数据填入

            ### Bug 修复
            - 修复大小事件丢失导致列表不显示大小的问题
            - 修复大小 key 不匹配导致部分应用大小显示为空的问题
            - 修复刷新按钮无明显反馈的问题（新增刷新进度条）
            - 修复 Viap 自身在批量迁移中可选择的问题

            ### 完整 Changelog
            详见 [CHANGELOG.md](https://github.com/ethan0925/viap/blob/main/CHANGELOG.md)
          prerelease: false
          args: ${{ matrix.args }}
